schema {
  query: Query
  mutation: Mutation
}

enum AttributeKeySortingField {
  CREATED_AT
  ID
  KEY
  UPDATED_AT
}

type BestSellingCategory {
  category: Category!
  itemsSold: Int!
  totalRevenueInCents: Float!
}

type BestSellingProductVariant {
  productVariant: ProductVariant!
  quantitySold: Int!
}

type Cart {
  createdAt: DateTime!
  id: Int!
  items: [CartItem!]!
  updatedAt: DateTime!
  userId: Int!
}

type CartItem {
  cartId: Int!
  createdAt: DateTime!
  id: Int!
  productVariant: ProductVariant!
  productVariantId: Int!
  quantity: Int!
  updatedAt: DateTime!
}

type Category {
  categoryProductVariants(attributeFilters: [[String!]!], cursor: Int, includeSubcategories: Boolean, pageSize: Int = 10): PaginatedProductVariant!
  createdAt: DateTime!
  description: String!
  id: Int!
  isPublic: Boolean!
  isSetup: Boolean!
  name: String
  parentCategoryId: Int
  productsCount: Int!
  slug: String!
  subcategories: [Category!]!
  translations(
    """
    empty array - all translations will be returned, [...string] - only the translation matching the locales in array will be returned
    """
    locales: [String!]!
  ): [CategoryTranslation!]!
  updatedAt: DateTime!
  usedProductVariantAttributes: [ProductVariantAttribute!]!
}

type CategoryEdge {
  cursor: Int!
  node: Category!
}

type CategoryTranslation {
  categoryId: Int!
  description: String
  id: Int!
  locale: String!
  name: String!
}

