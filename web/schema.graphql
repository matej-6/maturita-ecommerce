  """Locale code"""
  localeCode: String!
  """Category name"""
  name: String!
}

input EditProductTranslationInput {
  """Product description"""
  description: String
  """Locale code"""
  localeCode: String!
  """Product markdown content"""
  markdownContent: String
  """Product name"""
  name: String!
  """product translation id"""
  productTranslationId: Int!
}

enum EmbeddingTaskType {
  PRODUCT
  PRODUCT_CONTENT
}

type LLMTask {
  date: DateTime!
  id: Int!
  prompt: String!
  response: UserPromptResponse
  status: LLMTaskStatus!
  userId: Int!
}

enum LLMTaskStatus {
  COMPLETED
  FAILED
  IN_PROGRESS
  PENDING
}

type Locale {
  """Locale code"""
  code: String!
  flag: String!
  """Native locale name"""
  name: String!
}

type Mutation {
  addItemToCart(productVariantId: Int!, quantity: Int!): Cart!
  admin_deleteProductReview(reviewId: Int!): Boolean!
  cancelOrder(id: Int!): Order!
  changePassword(currentPassword: String!, newPassword: String!): Void!
  createCategory(createCategoryInput: CreateCategoryInput!): Category!
  createCategoryTranslation(newTranslationinput: CreateCategoryTranslationInput!): CategoryTranslation!
  createLlmTask(input: CreateLLMPromptInput!): LLMTask!
  createProduct(createProductInput: CreateProductInput!): Product!
  createProductReview(input: CreateProductReviewInput!): ProductReview!
  createProductTranslation(createProductTranslationInput: CreateProductTranslationInput!, productId: Int!): ProductTranslation!
  createProductVariant(createProductVariantInput: CreateProductVariantInput!): ProductVariant!
  createProductVariantAttribute(createProductVariantAttributeInput: CreateProductVariantAttributeInput!): ProductVariantAttribute!
  createProductVariantAttributeKey(createProductVariantAttributeKeyInput: CreateProductVariantAttributeKeyInput!): ProductVariantAttributeKey!
  createProductVariantAttributeKeyTranslation(input: CreateProductVariantAttributeKeyTranslationInput!): ProductVariantAttributeKeyTranslation!
  createProductVariantAttributeTranslation(input: CreateProductVariantAttributeTranslationInput!): ProductVariantAttributeTranslation!
  deleteAccount: Void
  deleteAvatar: Void!
  deleteCategoryTranslation(categoryTranslationId: Int!): Int!
  deleteProductImage(productImageId: Int!): Int!
  deleteProductReview(reviewId: Int!): Boolean!
  deleteProductTranslation(productTranslationId: Int!): Int!
  editProductTranslation(editProductTranslationInput: EditProductTranslationInput!): ProductTranslation!
  generateProductContentEmbedding(lang: String!, productId: Int!): ProductEmbedding
  generateProductEmbedding(lang: String!, productId: Int!): ProductEmbedding
  logoutAll: Void!
  regenerateAllProductContentEmbeddings: Void!
  regenerateAllProductEmbeddings: Void!
  removeCategory(id: Int!): Category!
  removeProduct(id: Int!): Product!
  removeProductVariant(id: Int!): Int!
  removeProductVariantAttribute(id: Int!): Void!
  removeProductVariantAttributeKey(id: Int!): Void!
  removeProductVariantAttributeKeyTranslation(id: Int!): Void!
  removeProductVariantAttributeTranslation(id: Int!): Void!
  removeProductVariantImage(id: Int!): Int!
  retryPendingPayment(orderId: Int!): String!
  setProductThumbnailImage(productImageId: Int!): ProductImage!
  setProductVariantThumbnailImage(id: Int!): ProductVariantImage!
  updateCartItemQuantity(cartItemId: Int!, quantity: Int!): Cart!
  updateCategory(updateCategoryInput: UpdateCategoryInput!): Category!
  updateCategoryTranslation(editTranslationInput: EditCategoryTranslationInput!): CategoryTranslation!
  updateOrder(input: UpdateOrderDto!, orderId: Int!): Void!
  updatePassword(input: UpdatePasswordInput!): Void!
  updateProduct(updateProductInput: UpdateProductInput!): Product!
  updateProductReview(input: UpdateProductReviewInput!): ProductReview!
  updateProductVariant(updateProductVariantInput: UpdateProductVariantInput!): ProductVariant!
  updateProductVariantAttribute(updateProductVariantAttributeInput: UpdateProductVariantAttributeInput!): ProductVariantAttribute!
  updateProductVariantAttributeKey(updateProductVariantAttributeKeyInput: UpdateProductVariantAttributeKeyInput!): ProductVariantAttributeKey!
  updateProductVariantAttributeKeyTranslation(input: UpdateProductVariantAttributeKeyTranslationInput!): ProductVariantAttributeKeyTranslation!
  updateProductVariantAttributeTranslation(input: UpdateProductVariantAttributeTranslationInput!): ProductVariantAttributeTranslation!
  updateUser(input: UpdateUserInput!): User!
  updateUserRole(newRole: Role!, userId: Int!): Void!
}

type Order {
  createdAt: DateTime!
  id: Int!
  items: [OrderItem!]!
  shippingDetails: OrderShippingDetails
  status: OrderStatus!
  totalInCents: Int!
  updatedAt: DateTime!
  userId: Int
}

type OrderEdge {
  cursor: Int!
  node: Order!
}

type OrderItem {
  createdAt: DateTime!
  id: Int!
  orderId: Int!
  productReview: ProductReview
  productVariant: ProductVariant
  productVariantId: Int
  quantity: Int!
  sku: String!
  unitPriceInCents: Int!
  updatedAt: DateTime!
}

type OrderShippingDetails {
  city: String
  country: String!
  createdAt: DateTime!
  id: Int!
  line1: String!
  line2: String
  name: String!
  orderId: Int!
  phone: String
  postalCode: String!
  state: String
