schema {
  query: Query
  mutation: Mutation
}

type Category {
  createdAt: DateTime!
  description: String!
  id: ID!
  isPublic: Boolean!
  isSetup: Boolean!
  name: String
  parentCategoryId: String
  slug: String!
  subcategories: [Category!]!
  """Category translations"""
  translations(filtersInput: CategoryTranslationsQueryFilter!): [CategoryTranslation!]
  updatedAt: DateTime!
}

input CategoryFindAllQueryFilterInput {
  isPublic: Boolean
  isSetup: Boolean
  """
  null - only categories with no parent category will be returned, '*' - all categories will be returned, 'uuid' - only the children of category with given uuid will be returned
  """
  parentCategoryId: String
}

input CategoryFindOneQueryFilterInput {
  isPublic: Boolean
  isSetup: Boolean
}

type CategoryTranslation {
  categoryId: ID!
  description: String
  id: ID!
  isActive: Boolean!
  locale: String!
  name: String!
}

input CategoryTranslationsQueryFilter {
  """
  empty array - all translations will be returned, [...string] - only the translation matching the locales in array will be returned
  """
  locales: [String!]!
}

input CreateCategoryInput {
  """Parent category id"""
  parentCategoryId: String
  """Slug of the category"""
  slug: String!
}

input CreateCategoryTranslationInput {
  """category id"""
  categoryId: ID!
  """Category description"""
  description: String
  """Locale code"""
  localeCode: String!
  """Category name"""
  name: String!
}

input CreateUserInput {
  confirmPassword: String!
  email: String!
  lastName: String!
  name: String!
  password: String!
}

"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

input EditCategoryTranslationInput {
  """category translation id"""
  categoryTranslationId: ID!
  """Category description"""
  description: String
  """Locale code"""
  localeCode: String!
  """Category name"""
  name: String!
}

type Locale {
  """Locale code"""
  code: String!
  flag: String!
  """Native locale name"""
  name: String!
}

type MeResponse {
  avatar: String
  createdAt: DateTime!
  email: String!
  emailVerified: Boolean!
  firstName: String
  id: ID!
  lastName: String
  role: Role!
  updatedAt: DateTime!
}

type Mutation {
  createCategory(createCategoryInput: CreateCategoryInput!): Category!
  createCategoryTranslation(newTranslationinput: CreateCategoryTranslationInput!): CategoryTranslation!
  createUser(createUserInput: CreateUserInput!): User!
  deleteCategoryTranslation(categoryTranslationId: ID!): ID!
  logoutAll: Void!
  removeCategory(id: ID!): Category!
  removeUser(id: String!): User!
  requestEmailVerification: Void!
  updateCategory(updateCategoryInput: UpdateCategoryInput!): Category!
  updateCategoryTranslation(editTranslationInput: EditCategoryTranslationInput!): CategoryTranslation!
  updateUser(updateUserInput: UpdateUserInput!): User!
  verifyEmail(verifyEmailInput: VerifyEmailInput!): Void!
}

type Query {
  categories(filtersInput: CategoryFindAllQueryFilterInput): [Category!]!
  category(filters: CategoryFindOneQueryFilterInput, id: ID!): Category!
  locale(id: String!): Locale!
  locales: [Locale!]!
  me: MeResponse!
  user(id: String!): User!
  users: [User!]!
}

"""User role"""
enum Role {
  ADMIN
  MODERATOR
  USER
}

input UpdateCategoryInput {
  id: ID!
  """Parent category id"""
  parentCategoryId: String
  """Slug of the category"""
  slug: String!
}

input UpdateUserInput {
  email: String!
  firstName: String!
  id: String!
  lastName: String!
}

type User {
  """Example field (placeholder)"""
  exampleField: Int!
}

input VerifyEmailInput {
  code: String!
  email: String!
}

"""Represents NULL values"""
scalar Void