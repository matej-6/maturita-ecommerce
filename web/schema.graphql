}

enum OrderStatus {
  CANCELED
  DELIVERED
  FAILED
  PENDING
  PROCESSING
  SHIPPED
}

type OverallTrendStatistic {
  percentChange: Float!
  points: [RevenueDataPoint!]!
  timePeriod: TimePeriod!
}

type PaginatedCategory {
  edges: [CategoryEdge!]
  nextCursor: Int
  totalCount: Int!
}

type PaginatedOrder {
  edges: [OrderEdge!]
  nextCursor: Int
  totalCount: Int!
}

type PaginatedProduct {
  edges: [ProductEdge!]
  nextCursor: Int
  totalCount: Int!
}

type PaginatedProductReview {
  edges: [ProductReviewEdge!]
  nextCursor: Int
  totalCount: Int!
}

type PaginatedProductVariant {
  edges: [ProductVariantEdge!]
  nextCursor: Int
  totalCount: Int!
}

type PaginatedProductVariantAttributeKey {
  edges: [ProductVariantAttributeKeyEdge!]
  nextCursor: Int
  totalCount: Int!
}

type PaginatedUser {
  edges: [UserEdge!]
  nextCursor: Int
  totalCount: Int!
}

type Product {
  categoryId: Int
  contentEmbeddings: [ProductEmbedding!]!
  createdAt: DateTime!
  description: String
  embeddings: [ProductEmbedding!]!
  """Product ID"""
  id: Int!
  images: [ProductImage!]!
  isPublic: Boolean!
  isSetup: Boolean!
  markdownContent: String
  missingContentEmbeddingLanguages: [String!]!
  missingEmbeddingLanguages: [String!]!
  name: String
  """Product slug"""
  slug: String!
  thumbnailImage: ProductImage
  translations: [ProductTranslation!]!
  updatedAt: DateTime!
  variants(includeHidden: Boolean! = false): [ProductVariant!]!
}

type ProductEdge {
  cursor: Int!
  node: Product!
}

type ProductEmbedding {
  createdAt: DateTime!
  id: Int!
  lang: String!
  productId: Int!
  status: LLMTaskStatus!
  type: EmbeddingTaskType!
}

type ProductImage {
  id: Int!
  isThumbnail: Boolean!
  productId: Int!
  url: String!
}

type ProductReview {
  author: ProductReviewAuthor
  comment: String
  createdAt: DateTime!
  id: Int!
  lang: String!
  orderItemId: Int!
  productVariant: ProductVariant
  rating: Int!
}

type ProductReviewAuthor {
  avatarUrl: String
  firstName: String!
  lastName: String!
}

type ProductReviewEdge {
  cursor: Int!
  node: ProductReview!
}

type ProductTranslation {
  description: String
  id: Int!
  locale: String!
  markdownContent: String
  name: String!
  productId: Int!
}

type ProductVariant {
  attributes: [ProductVariantAttribute!]!
  createdAt: DateTime!
  id: Int!
  images: [ProductVariantImage!]!
  isPublic: Boolean!
  priceInCents: Int!
  product: Product!
  productId: Int!
  sku: String!
  stock: Int!
  thumbnailImage: ProductVariantImage
  updatedAt: DateTime!
}

type ProductVariantAttribute {
  attributeKeyId: Int!
  id: Int!
  key: ProductVariantAttributeKey
  productVariants: [ProductVariant!]!
  translatedValue: String
  translations: [ProductVariantAttributeTranslation!]!
  value: String!
}

type ProductVariantAttributeKey {
  attributes: [ProductVariantAttribute!]!
  createdAt: DateTime!
  id: Int!
  key: String!
  translatedKey: String
  translations: [ProductVariantAttributeKeyTranslation!]!
  updatedAt: DateTime!
}

type ProductVariantAttributeKeyEdge {
  cursor: Int!
  node: ProductVariantAttributeKey!
}

type ProductVariantAttributeKeyTranslation {
  attributeKeyId: Int!
  id: Int!
  keyTranslation: String!
  locale: String!
}

type ProductVariantAttributeTranslation {
  attributeId: Float!
  id: Float!
  locale: String!
  value: String!
}

type ProductVariantEdge {
  cursor: Int!
  node: ProductVariant!
}

type ProductVariantImage {
  id: Int!
  isThumbnail: Boolean!
  productVariantId: Int!
  url: String!
}

type Query {
  allProducts(
    """
    null - only products with no category will be returned, 0 - all products will be returned, int >= 1 - only the children of category with given id will be returned
    """
    categoryId: Int
    isPublic: Boolean
    isSetup: Boolean
    slug: String
  ): [Product!]!
  bestSellingCategoriesStatistic(limit: Int, timePeriod: TimePeriod!): [BestSellingCategory!]
  bestSellingProductVariantsStatistic(limit: Int, timePeriod: TimePeriod!): [BestSellingProductVariant!]
  cart: Cart!
  categories(
    """
    If true, sort in ascending order, else descending. If null, default sorting order is used
    """
    ascending: Boolean
    """Filter categories by id equal to this value"""
    idQuery: Int
    isPublic: Boolean
    isSetup: Boolean
    """
    null - only categories with no parent category will be returned, 0 - all categories will be returned, int >= 1 - only the children of category with given id will be returned
    """
    parentCategoryId: Int
    """Filter categories by slug containing this query string"""
    slugQuery: String
    """Field to sort by"""
    sortBy: String
  ): [Category!]!
  category(id: Int, isPublic: Boolean, isSetup: Boolean, slug: String): Category!
  findAllPaginatedOrders(ascending: Boolean, cursor: Int, dateFrom: DateTime, dateTo: DateTime, id: Int, maxPrice: Int, minPrice: Int, pageSize: Int = 10, sortBy: String, status: OrderStatus, userId: Int): PaginatedOrder!
  findAllPaginatedProductVariantAttributeKeys(ascending: Boolean, cursor: Int, id: Int, key: String, pageSize: Int = 10, sortBy: AttributeKeySortingField): PaginatedProductVariantAttributeKey!
  findAllPaginatedUsers(ascending: Boolean, cursor: Int, email: String, id: Int, pageSize: Int = 10, role: Role, sortBy: UserSortingField): PaginatedUser!
  findOneProductVariantAttribute(id: Int!): ProductVariantAttribute
  findOrderById(id: Int!): Order
  getUserLLMTaskById(id: Int!): LLMTask
  locale(id: String!): Locale!
  locales: [Locale!]!
  me: User!
  missingProductContentEmbeddingLanguages(productId: Int!): [String!]!
  missingProductEmbeddingLanguages(productId: Int!): [String!]!
  order(id: Int!): Order
  orders: [Order!]!
  paginatedCategories(
    """
    If true, sort in ascending order, else descending. If null, default sorting order is used
    """
    ascending: Boolean
    cursor: Int
    """Filter categories by id equal to this value"""
    idQuery: Int
    isPublic: Boolean
    isSetup: Boolean
    pageSize: Int = 10
    """
    null - only categories with no parent category will be returned, 0 - all categories will be returned, int >= 1 - only the children of category with given id will be returned
    """
    parentCategoryId: Int
    """Filter categories by slug containing this query string"""
    slugQuery: String
    """Field to sort by"""
    sortBy: String
  ): PaginatedCategory!
  paginatedProductReviews(cursor: Int, pageSize: Int = 10): PaginatedProductReview!
  paginatedProductReviewsByProductId(cursor: Int, pageSize: Int = 10, productId: Int!): PaginatedProductReview!
  product(id: Int!, isPublic: Boolean, isSetup: Boolean): Product
  productBySlug(slug: String!): Product
  productContentEmbedding(id: Int!): ProductEmbedding
  productContentEmbeddings(productId: Int!): [ProductEmbedding!]!
  productEmbedding(id: Int!): ProductEmbedding
  productEmbeddings(productId: Int!): [ProductEmbedding!]!
  productVariantAttributeKey(id: Int!): ProductVariantAttributeKey!
  productVariantAttributeKeys(productId: Int): [ProductVariantAttributeKey!]!
  productVariantAttributes: [ProductVariantAttribute!]!
  productVariantsByIds(ids: [Int!]!): [ProductVariant!]!
  products(
    ascending: Boolean
    """
    null - only products with no category will be returned, 0 - all products will be returned, int >= 1 - only the children of category with given id will be returned
    """
    categoryId: Int
    cursor: Int
    isPublic: Boolean
    isSetup: Boolean
    pageSize: Int = 10
    slug: String
    sortBy: String
  ): PaginatedProduct!
  revenuePerDayStatistic(timePeriod: TimePeriod!): OverallTrendStatistic
  searchProductVariants(ascending: Boolean, attributeFilters: [[String!]!], cursor: Int, pageSize: Int = 10, searchTerm: String, sortBy: String): PaginatedProductVariant!
  user(id: ID!): User!
}

type RevenueDataPoint {
  date: String!
  revenue: Float!
}

