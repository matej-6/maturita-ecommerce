schema {
  query: Query
  mutation: Mutation
}

type Category {
  createdAt: DateTime!
  description: String!
  id: Int!
  isPublic: Boolean!
  isSetup: Boolean!
  name: String
  parentCategoryId: Int
  productsCount: Int!
  slug: String!
  subcategories: [Category!]!
  translations(
    """
    empty array - all translations will be returned, [...string] - only the translation matching the locales in array will be returned
    """
    locales: [String!]!
  ): [CategoryTranslation!]!
  updatedAt: DateTime!
}

type CategoryEdge {
  cursor: Int!
  node: Category!
}

type CategoryTranslation {
  categoryId: Int!
  description: String
  id: Int!
  locale: String!
  name: String!
}

input CreateCategoryInput {
  """Parent category id"""
  parentCategoryId: Int
  """Slug of the category"""
  slug: String!
}

input CreateCategoryTranslationInput {
  """category id"""
  categoryId: Int!
  """Category description"""
  description: String
  """Locale code"""
  localeCode: String!
  """Category name"""
  name: String!
}

input CreateProductInput {
  """Parent category id"""
  categoryId: Int
  isPublic: Boolean!
  """Product slug"""
  slug: String!
}

input CreateProductVariantInput {
  """Example field (placeholder)"""
  exampleField: Int!
}

input CreateUserInput {
  confirmPassword: String!
  email: String!
  lastName: String!
  name: String!
  password: String!
}

"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

input EditCategoryTranslationInput {
  """category translation id"""
  categoryTranslationId: Int!
  """Category description"""
  description: String
  """Locale code"""
  localeCode: String!
  """Category name"""
  name: String!
}

type Locale {
  """Locale code"""
  code: String!
  flag: String!
  """Native locale name"""
  name: String!
}

type MeResponse {
  avatar: String
  createdAt: DateTime!
  email: String!
  emailVerified: Boolean!
  firstName: String
  id: ID!
  lastName: String
  role: Role!
  updatedAt: DateTime!
}

type Mutation {
  createCategory(createCategoryInput: CreateCategoryInput!): Category!
  createCategoryTranslation(newTranslationinput: CreateCategoryTranslationInput!): CategoryTranslation!
  createProduct(createProductInput: CreateProductInput!): Product!
  createProductVariant(createProductVariantInput: CreateProductVariantInput!): ProductVariant!
  createUser(createUserInput: CreateUserInput!): User!
  deleteCategoryTranslation(categoryTranslationId: Int!): Int!
  logoutAll: Void!
  removeCategory(id: Int!): Category!
  removeProduct(id: Int!): Product!
  removeProductVariant(id: Int!): ProductVariant!
  removeUser(id: ID!): User!
  requestEmailVerification: Void!
  updateCategory(updateCategoryInput: UpdateCategoryInput!): Category!
  updateCategoryTranslation(editTranslationInput: EditCategoryTranslationInput!): CategoryTranslation!
  updateProduct(updateProductInput: UpdateProductInput!): Product!
  updateProductVariant(updateProductVariantInput: UpdateProductVariantInput!): ProductVariant!
  updateUser(updateUserInput: UpdateUserInput!): User!
  verifyEmail(verifyEmailInput: VerifyEmailInput!): Void!
}

type PaginatedCategory {
  edges: [CategoryEdge!]
  hasNextPage: Boolean!
  totalCount: Int!
}

type PaginatedProduct {
  edges: [ProductEdge!]
  hasNextPage: Boolean!
  totalCount: Int!
}

type Product {
  categoryId: Int
  description: String
  """Product ID"""
  id: Int!
  isPublic: Boolean!
  isSetup: Boolean!
  markdownContent: String
  name: String
  """Product slug"""
  slug: String!
  translations: [ProductTranslation!]!
  variants(includeHidden: Boolean! = false): [ProductVariant!]!
}

type ProductEdge {
  cursor: Int!
  node: Product!
}

type ProductTranslation {
  description: String
  id: Int!
  locale: String!
  markdownContent: String
  name: String!
  productId: Int!
}

type ProductVariant {
  attributes: [ProductVariantAttribute!]!
  id: Float!
  isPublic: Boolean!
  priceInCents: Float!
  productId: Float!
  sku: String!
}

type ProductVariantAttribute {
  attributeKeyId: Float!
  id: Float!
  productVariantId: Float
}

type Query {
  categories(
    """
    If true, sort in ascending order, else descending. If null, default sorting order is used
    """
    ascending: Boolean
    """Filter categories by id equal to this value"""
    idQuery: Int
    isPublic: Boolean
    isSetup: Boolean
    """
    null - only categories with no parent category will be returned, 0 - all categories will be returned, int >= 1 - only the children of category with given id will be returned
    """
    parentCategoryId: Int
    """Filter categories by slug containing this query string"""
    slugQuery: String
    """Field to sort by"""
    sortBy: String
  ): [Category!]!
  category(id: Int!, isPublic: Boolean, isSetup: Boolean): Category!
  locale(id: String!): Locale!
  locales: [Locale!]!
  me: MeResponse!
  paginatedCategories(
    """
    If true, sort in ascending order, else descending. If null, default sorting order is used
    """
    ascending: Boolean
    cursor: Int
    """Filter categories by id equal to this value"""
    idQuery: Int
    isPublic: Boolean
    isSetup: Boolean
    pageSize: Int = 10
    """
    null - only categories with no parent category will be returned, 0 - all categories will be returned, int >= 1 - only the children of category with given id will be returned
    """
    parentCategoryId: Int
    """Filter categories by slug containing this query string"""
    slugQuery: String
    """Field to sort by"""
    sortBy: String
  ): PaginatedCategory!
  product(id: Int!, isPublic: Boolean, isSetup: Boolean): Product!
  products(
    """
    null - only products with no category will be returned, 0 - all products will be returned, int >= 1 - only the children of category with given id will be returned
    """
    categoryId: Int
    cursor: Int
    isPublic: Boolean
    isSetup: Boolean
    pageSize: Int = 10
  ): PaginatedProduct!
  user(id: ID!): User!
  users: [User!]!
}

"""User role"""
enum Role {
  ADMIN
  MODERATOR
  USER
}

input UpdateCategoryInput {
  """Category id"""
  id: Int!
  """Parent category id"""
  parentCategoryId: Int
  """Slug of the category"""
  slug: String!
}

input UpdateProductInput {
  """Parent category id"""
  categoryId: Int
  id: Int!
  isPublic: Boolean!
  """Product slug"""
  slug: String!
}

input UpdateProductVariantInput {
  """Example field (placeholder)"""
  exampleField: Int
  id: Int!
}

input UpdateUserInput {
  email: String!
  firstName: String!
  id: Int!
  lastName: String!
}

type User {
  """Example field (placeholder)"""
  exampleField: Int!
}

input VerifyEmailInput {
  code: String!
  email: String!
}

"""Represents NULL values"""
scalar Void