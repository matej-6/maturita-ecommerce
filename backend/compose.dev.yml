services:
  database:
    image: mariadb:12.0.2
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=app
      - MYSQL_ROOT_PASSWORD=password
    ports:
      - "3306:3306"
    volumes:
      - gofitshop_db_data_dev:/var/lib/mysql
    networks:
      - gofitshop_network_dev
  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command: ["redis-server", "--loglevel", "warning"]
    ports:
      - "6379:6379"
    volumes:
      - gofitshop_redis_data_dev:/data
    networks:
      - gofitshop_network_dev
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - gofitshop_qdrant_data_dev:/qdrant/storage
    networks:
      - gofitshop_network_dev
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    restart: unless-stopped
    volumes:
      - gofitshop_ollama_data_dev:/root/.ollama
    networks:
      - gofitshop_network_dev
    entrypoint: >
      sh -c "
      ollama serve &
      sleep 5 &&
      ollama pull mistral:7b &&
      ollama pull qwen3-embedding:4b &&
      wait
      "
  api:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - .:/app
      - gofitshop_public_images_data_dev:/app/public/images
    networks:
      - gofitshop_network_dev
    command: sh -c "NODE_ENV=development npm run dev"
    ports:
      - "8080:8080"
    depends_on:
      - database
      - ollama
      - redis
      - qdrant
  nextjs:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - ../web:/app
    command: sh -c "NODE_ENV=development npm run dev"
    networks:
      - gofitshop_network_dev
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      - BACKEND_URL=http://api:8080

networks:
  gofitshop_network_dev:
volumes:
  gofitshop_db_data_dev:
  gofitshop_redis_data_dev:
  gofitshop_qdrant_data_dev:
  gofitshop_ollama_data_dev:
  gofitshop_public_images_data_dev:
