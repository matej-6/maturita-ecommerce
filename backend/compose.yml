services:
  database:
    image: mariadb:12.0.2
    restart: unless-stopped
    environment:
      - MYSQL_USER=user
      - MYSQL_DATABASE=app
      - MYSQL_PASSWORD=password
      - MYSQL_ROOT_PASSWORD=password
    ports:
      - "3306:3306"
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    restart: unless-stopped
    entrypoint: >
      sh -c "
      ollama serve &
      sleep 5 &&
      ollama pull mistral:7b &&
      ollama pull qwen3-embedding:4b &&
      wait
      "
