services:
  database:
    image: mariadb:12.0.2
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=app
      - MYSQL_ROOT_PASSWORD=password
    volumes:
      - gofitshop_db_data:/var/lib/mysql
    networks:
      - gofitshop_network
  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command: ["redis-server"]
    volumes:
      - gofitshop_redis_data:/data
    networks:
      - gofitshop_network
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - gofitshop_qdrant_data:/qdrant/storage
    networks:
      - gofitshop_network
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - gofitshop_ollama_data:/root/.ollama
    networks:
      - gofitshop_network
    entrypoint: >
      sh -c "
      ollama serve &
      sleep 5 &&
      ollama pull mistral:7b &&
      ollama pull qwen3-embedding:4b &&
      wait
      "
  api:
    image: node:22-bookworm
    working_dir: /app
    command: sh -c "NODE_ENV=production nest build && NODE_ENV=production nest start"
    volumes:
      - .:/app
      - gofitshop_public_images_data:/app/public/images
    networks:
      - gofitshop_network
    restart: unless-stopped
    depends_on:
      - database
      - ollama
      - redis
      - qdrant
  nextjs:
    image: node:22-bookworm
    working_dir: /app
    command: sh -c "NODE_ENV=production next start"
    volumes:
      - ../web:/app
    restart: unless-stopped
    networks:
      - gofitshop_network
    depends_on:
      - api
  stripe-cli:
    image: stripe/stripe-cli:v1.35.0
    env_file:
      - ./.env
    command: "listen --api-key ${STRIPE_API_KEY} --device-name ${STRIPE_DEVICE_NAME} --forward-to http://api:8080/orders/webhook"
    restart: unless-stopped
    networks:
      - gofitshop_network
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./conf:/etc/caddy
    networks:
      - gofitshop_network

networks:
  gofitshop_network:
volumes:
  gofitshop_db_data:
  gofitshop_redis_data:
  gofitshop_qdrant_data:
  gofitshop_public_images_data:
  gofitshop_ollama_data:
